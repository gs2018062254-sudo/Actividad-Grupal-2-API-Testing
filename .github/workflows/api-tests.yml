name: Pruebas de API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  cypress-api:
    runs-on: ubuntu-latest
    steps:
      - name: Obtener código
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Instalar dependencias
        run: npm install
      - name: Iniciar API y esperar disponibilidad
        run: |
          npm start > server.log 2>&1 &
          for attempt in {1..30}; do
            if curl --silent --fail http://127.0.0.1:3000/health; then exit 0; fi
            sleep 1
          done
          cat server.log
          exit 1
      - name: Ejecutar pruebas Cypress
        run: npm run test:api
      - name: Guardar video de la suite
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-api-results
          path: cypress/videos
          if-no-files-found: ignore
